# The demo profile deliberately points at a separate database.
spring.datasource.url=${DEMO_DB_URL:jdbc:postgresql://localhost:5432/ecom_demo}
spring.datasource.username=${DEMO_DB_USERNAME:postgres}
spring.datasource.password=${DEMO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

spring.app.jwtSecret=${DEMO_JWT_SECRET}
spring.app.jwtCookieSecure=${COOKIE_SECURE:false}

demo.seed.customer.password=${DEMO_CUSTOMER_PASSWORD}
demo.seed.admin.password=${DEMO_ADMIN_PASSWORD}
