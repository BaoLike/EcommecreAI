spring.application.name=sb-ecom
server.port=${SERVER_PORT:8080}

# Use a local database by default; production credentials must come from the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Ecommerce}
spring.datasource.username=${DB_USERNAME:erp_user}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

project.image=${PROJECT_IMAGE_DIR:images/}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images/}
frontEnd.url=${FRONTEND_URL:http://localhost:5173}

# JWT uses a base64 encoded key with at least 256 bits of entropy.
spring.app.jwtSecret=${JWT_SECRET:AA/9HxTk8dqrkp577T+zhVCV5+ht7dSIFdRmafJTpcZrYjeHPePADkgXPUPuu+tJ}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
spring.app.jwtCookieSecure=${COOKIE_SECURE:true}
spring.app.jwtCookieSameSite=${JWT_COOKIE_SAME_SITE:Lax}
spring.ecom.app.jwtCookieName=${JWT_COOKIE_NAME:baolikeEcom}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}

orders.reservation-minutes=${ORDER_RESERVATION_MINUTES:20}
orders.expiration-scan-ms=${ORDER_EXPIRATION_SCAN_MS:60000}

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
